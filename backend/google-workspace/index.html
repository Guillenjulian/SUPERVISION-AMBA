<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Supervisión - AMBA</title>
    <link rel="stylesheet" href="style.css"> <!-- Opcional: tu archivo de estilos -->
</head>
<body>
    <h1>Registro de Supervisión</h1>
    <form id="formSupervision">
        <label for="email">Email del Supervisor:</label>
        <input type="email" id="email" name="email" required placeholder="ejemplo@gmail.com"><br><br>

        <label for="sector">Sector:</label>
        <select id="sector" name="sector">
            <option value="Norte">Zona Norte</option>
            <option value="Sur">Zona Sur</option>
            <option value="Oeste">Zona Oeste</option>
            <option value="CABA">CABA</option>
        </select><br><br>

        <label for="estado">Estado:</label>
        <input type="text" id="estado" name="estado" placeholder="Ej: OK, Pendiente..."><br><br>

        <label for="observaciones">Observaciones:</label><br>
        <textarea id="observaciones" name="observaciones" rows="4" cols="50"></textarea><br><br>

        <button type="submit">Enviar a Google Sheets</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
